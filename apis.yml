aid: supira-medical
name: Supira Medical
description: 'Supira Medical, Inc. is a clinical-stage medical device company in Los
  Gatos, California, and a portfolio company of the Shifamed medtech innovation hub.
  It is developing a next-generation percutaneous ventricular assist device (pVAD)
  — a catheter-based blood pump delivered through a 10 French (approximately 3.3 mm)
  sheath — intended to provide temporary cardiovascular hemodynamic support for patients
  undergoing high-risk percutaneous coronary intervention (HRPCI) and for patients
  in cardiogenic shock. The system has received FDA Breakthrough Device Designation
  and is in U.S. clinical study. The company is privately held and has raised capital
  through Series A–E financings led by investors including Cormorant Asset Management
  and The Capital Partnership. Supira Medical builds implantable and catheter-based
  hardware; it does not operate a public developer program, publish machine-readable
  API descriptions, or ship client libraries, and no public API surface was found
  for it.'
